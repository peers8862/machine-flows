# Capability ladder for mach completions.
#
# The router proposal (a models.toml draft and ladder notes)
# was not available when this file was written.
# Field names here are
# the minimum that implements the issue text. They are not a copy of that draft.
# Model ids are placeholders (`example-*`). usd_per_call figures on paid tiers
# are placeholders so a daily cap has a number to compare; replace both when
# the draft or a real bill is available.
#
# Rejected, and refused by the loader: a headless Playwright session driving
# ChatGPT (ToS violation, ban risk, bot-detection arms race).
#
# Keys are environment-variable names only. No tokens belong in this file.
# Paid tiers (batch, cheap, strong) are skipped once a subsystem's spend for
# the local day reaches its cap. default_max_usd_per_day = 0 means a subsystem
# with no entry cannot spend. local and free never count against the cap.
# Per-class lists all use the issue's tier order. The missing LADDER.md is
# where a class would have dropped or kept rungs; edit one list to do that.

schema = 1

[ladder]
order = ["local", "free", "batch", "cheap", "strong"]

[tiers.local]
billable = false
fast = false
providers = ["ollama"]

[tiers.free]
billable = false
fast = true
providers = ["groq", "gemini", "openrouter", "cerebras"]

[tiers.batch]
billable = true
fast = false
non_urgent_only = true
discount = 0.5
providers = ["batch"]

[tiers.cheap]
billable = true
fast = false
providers = ["deepinfra", "together"]

[tiers.strong]
billable = true
fast = false
providers = ["frontier"]

[providers.ollama]
model = "example-local"
base_url = "http://127.0.0.1:11434/v1"
api_key_env = ""
usd_per_call = 0

[providers.groq]
model = "example-fast"
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
usd_per_call = 0

[providers.gemini]
model = "example-fast"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
api_key_env = "GEMINI_API_KEY"
usd_per_call = 0

[providers.openrouter]
model = "example-fast"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
usd_per_call = 0

[providers.cerebras]
model = "example-fast"
base_url = "https://api.cerebras.ai/v1"
api_key_env = "CEREBRAS_API_KEY"
usd_per_call = 0

[providers.batch]
model = "example-batch"
base_url = ""
api_key_env = "MACH_BATCH_API_KEY"
usd_per_call = 0.02

[providers.deepinfra]
model = "example-cheap"
base_url = "https://api.deepinfra.com/v1/openai"
api_key_env = "DEEPINFRA_API_KEY"
usd_per_call = 0.01

[providers.together]
model = "example-cheap"
base_url = "https://api.together.xyz/v1"
api_key_env = "TOGETHER_API_KEY"
usd_per_call = 0.01

[providers.frontier]
model = "example-strong"
base_url = ""
api_key_env = "MACH_FRONTIER_API_KEY"
usd_per_call = 0.05

[classes]
triage = ["local", "free", "batch", "cheap", "strong"]
extraction = ["local", "free", "batch", "cheap", "strong"]
synthesis = ["local", "free", "batch", "cheap", "strong"]
reasoning = ["local", "free", "batch", "cheap", "strong"]
chat = ["local", "free", "batch", "cheap", "strong"]
code = ["local", "free", "batch", "cheap", "strong"]

[channels.imessage]
policy = "sticky-with-escalation"
start_tier = "free"

[channels.cli]
policy = "unrestricted"

[budgets]
default_max_usd_per_day = 0
